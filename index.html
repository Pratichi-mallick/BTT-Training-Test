<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BTT Practice Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#ECEFEB;--paper:#F7F8F5;--ink:#22302A;--muted:#66736B;--line:#CED6CF;--accent:#6F8A79;--accent-ink:#F7F8F5;--good:#2E7D4F;--goodbg:#E1F1E6;--bad:#B5412F;--badbg:#F8E3DE;--f-display:"Italiana",Georgia,serif;--f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#161B18;--paper:#1E2420;--ink:#E4E9E4;--muted:#9AA69F;--line:#333D37;--accent:#9DB5A5;--accent-ink:#161B18;--good:#5CC487;--goodbg:#173322;--bad:#F08A78;--badbg:#3A1E19;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.bt-wrap{max-width:860px;margin:0 auto;padding:32px 18px 64px;display:grid;gap:22px}
.bt-eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bt-h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,7vw,62px);line-height:1;margin:4px 0 8px}
.bt-lede{margin:0;color:var(--muted);max-width:64ch}
.bt-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.bt-tab{flex:0 0 auto;font:600 13px var(--f-body);border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:3px;padding:7px 12px;cursor:pointer}
.bt-tab[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bt-tab.soon{opacity:.55}
.bt-dayhead{display:grid;gap:4px;border-top:1px solid var(--line);padding-top:18px}
.bt-h2{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.1;margin:0}
.bt-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:14px}
.bt-card{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
.bt-card h3{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--muted);margin:0 0 8px}
.bt-card p{margin:0 0 6px}.bt-card ul{margin:0;padding-left:18px;display:grid;gap:6px}
.bt-scope b{font-family:var(--f-display);font-weight:400;font-size:30px;display:block;line-height:1.1}
.bt-scope a{color:var(--ink)}
.bt-quizbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:3;border-bottom:1px solid var(--line)}
.bt-score{font-family:var(--f-mono);font-size:13px}.bt-score b{font-size:16px}
.bt-filters{display:flex;gap:6px;flex-wrap:wrap}
.bt-ghost{font:500 13px var(--f-body);background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:6px 10px;cursor:pointer}
.bt-ghost[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bt-q{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:16px 18px;display:grid;gap:12px}
.bt-qtop{display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.bt-qn{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.bt-lvl{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid currentColor;border-radius:2px;padding:1px 6px}
.bt-lvl.e{color:var(--good)}.bt-lvl.m{color:#9A6B3F}.bt-lvl.h{color:var(--bad)}
.bt-qtext{font-weight:600;font-size:16px;margin:0}
.bt-sign{width:110px;height:110px}
.bt-opts{display:grid;gap:8px}
.bt-opt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;font:500 15px var(--f-body);color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:4px;padding:10px 12px;cursor:pointer}
.bt-opt:hover:not(:disabled){border-color:var(--accent)}
.bt-opt:disabled{cursor:default}
.bt-box{flex:0 0 20px;height:20px;border:2px solid var(--muted);border-radius:4px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
.bt-opt.ok{border-color:var(--good);background:var(--goodbg)}.bt-opt.ok .bt-box{background:var(--good);border-color:var(--good)}
.bt-opt.no{border-color:var(--bad);background:var(--badbg)}.bt-opt.no .bt-box{background:var(--bad);border-color:var(--bad)}
.bt-why{display:none;font-size:14px;background:var(--bg);border-radius:4px;padding:10px 12px}
.bt-why.show{display:block}.bt-why .v{font-weight:700}.bt-why .v.ok{color:var(--good)}.bt-why .v.no{color:var(--bad)}
.bt-list{display:grid;gap:12px}
.bt-soon{color:var(--muted)}
.bt-foot{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.bt-foot a{color:var(--ink)}
@media (max-width:720px){.bt-grid{grid-template-columns:1fr}}
.bt-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.bt-btn{font:600 13px var(--f-body);text-decoration:none;background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:3px;padding:8px 12px}
.bt-btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
</style>
</head>
<body>
<div id="bt-app"></div>

<!-- ===== DAY 1 ===== -->
<script>
(window.BTT_DAYS=window.BTT_DAYS||[]).push({day:1,
tips:[
"<b>Shape and colour first:</b> blue circle = you MUST (mandatory); red ring = you must NOT (prohibitory). Red octagon = Stop; triangle pointing down = Give Way.",
"<b>X or slash?</b> On a blue disc with a red ring, an <b>X</b> means <b>No stopping</b>. A single <b>slash</b> means <b>No waiting</b>: you may stop only for passengers to get on or off.",
"<b>Stop always means stop.</b> Come to a full stop before the white line, even on an empty road. Give Way means slow down and stop only if necessary.",
"<b>Numbers in a red ring are limits:</b> speed is a maximum, and width (2.3 m), height (4.5 m) and weight (10 t) are the most you may be. Over 4.5 m tall needs a police escort.",
"<b>Read the whole sign name:</b> 'No entry for lorries' does not ban cars, and '3 or more axles' does not ban a 2-axle vehicle. Mock tests like these traps.",
"<b>Today:</b> read pp 9–13 (10 min), then do the quiz. If you score under 27/30, re-read the signs you missed and do the Hard questions again tomorrow."
],
qs:[
{l:"e",q:"Traffic signs are put up for two main purposes. What are they?",o:["To regulate traffic, and to warn and inform road users","To decorate the road and mark property lines","To advertise nearby businesses and amenities"],a:0,w:"Signs regulate traffic movements, and warn and inform road users of hazards or useful information (p 9)."},
{l:"e",s:"stop",q:"What does this sign mean?",o:["Slow down and give way only if a car is coming","Stop before the white line and give way to traffic from the right and left","Stop only if there is a police officer"],a:1,w:"Stop sign: stop before the white line, give way to traffic from the right and left (p 10)."},
{l:"e",q:"Signs with a blue circular background are generally:",o:["Warning signs","Information signs","Mandatory signs that you must obey"],a:2,w:"Blue circular signs are mandatory (compulsory) signs (pp 9–10)."},
{l:"e",s:"noentry",q:"What does this sign mean?",o:["No entry for all vehicles","One-way street ahead","Road closed to pedestrians only"],a:0,w:"Red disc with a white bar = No entry for all vehicles (p 11)."},
{l:"e",s:"speed50",q:"What does this sign mean?",o:["Recommended speed 50 km/h","Do not exceed 50 km/h","Minimum speed 50 km/h"],a:1,w:"A number in a red ring is a speed limit: do not exceed it (p 13)."},
{l:"e",s:"giveway",q:"What should you do at this sign?",o:["Slow down, stop if necessary, and give way to traffic on the major road","Always come to a full stop","You have priority over the major road"],a:0,w:"Give Way: slow down, stop if necessary, give way to traffic on the major road (p 10)."},
{l:"e",q:"Disobeying a mandatory sign is:",o:["Only advice, not an offence","An offence only if it causes an accident","An offence"],a:2,w:"Mandatory signs are compulsory; it is an offence to disobey them (p 9)."},
{l:"e",s:"left",q:"What does this sign mean?",o:["No left turn","Turn left only","Left lane ends ahead"],a:1,w:"Blue circle with a left arrow = Turn left only (p 9)."},
{l:"e",s:"ahead",q:"What does this sign mean?",o:["Ahead only","Overtaking permitted","One-way street begins"],a:0,w:"Blue circle with an upward arrow = Ahead only (p 9)."},
{l:"e",s:"noright",q:"What does this sign mean?",o:["Right turn only","Sharp bend to the right","No right turn"],a:2,w:"Red ring with a crossed-out right arrow = No right turn (p 11)."},
{l:"m",s:"nostop",q:"What does this sign mean?",o:["No waiting","No stopping","No parking for lorries"],a:1,w:"Blue disc, red ring and a red X = No stopping (p 11)."},
{l:"m",s:"nowait",q:"What does this sign allow?",o:["Stopping only to let passengers board or alight","Stopping for up to 15 minutes","No stopping at all"],a:0,w:"No waiting: vehicles may stop only to allow boarding or alighting (p 11)."},
{l:"m",s:"keepleft",q:"What does this sign tell you to do?",o:["Turn left at the next junction","Keep to the left (pass on the left of it)","Left lane closed ahead"],a:1,w:"Mandatory Keep left sign (p 9)."},
{l:"m",s:"split",q:"What does this 'split traffic' sign mean?",o:["Traffic must keep left","Road divides; no entry ahead","Vehicles may pass on either side"],a:2,w:"Split traffic: vehicles may pass on either side (p 9)."},
{l:"m",q:"You see a 'Stop for children to cross the road' sign. You must:",o:["Stop","Slow down and continue if no children are on the road","Sound your horn to warn the children"],a:0,w:"It is a mandatory sign: stop for children to cross (p 10)."},
{l:"m",s:"height",q:"This sign prohibits:",o:["Vehicles taller than 4.5 m","Vehicles longer than 4.5 m","Parking within 4.5 m"],a:0,w:"Height limit: no entry for vehicles over 4.5 m overall height (p 12)."},
{l:"m",s:"width",q:"This sign means:",o:["The road ahead is 2.3 m wide","Keep a 2.3 m gap from the car in front","No entry for vehicles wider than 2.3 m"],a:2,w:"Width limit: prohibits vehicles wider than 2.3 m (p 12)."},
{l:"m",q:"A '10 tonnes' weight limit sign applies to a vehicle's weight when it is:",o:["Laden only","Laden or unladen","Unladen only"],a:1,w:"The weight limit covers weight laden or unladen (p 12)."},
{l:"m",q:"Where a 'No sounding of horn' sign is displayed, you may use your horn:",o:["Only to prevent an accident","Never, for any reason","Only between 7am and 7pm"],a:0,w:"No sounding of horn, except to prevent an accident (p 13)."},
{l:"m",q:"A prohibitory sign is usually recognised by:",o:["A blue circular background","A red circular border","A red triangle"],a:1,w:"Prohibitory signs have a red ring (pp 11–13)."},
{l:"h",q:"You reach a STOP sign and the road is completely clear in both directions. You should:",o:["Roll slowly over the line since nothing is coming","Stop only if there is traffic","Come to a complete stop before the white line, then go when safe"],a:2,w:"A Stop sign always requires a full stop before the line, whatever the traffic (p 10)."},
{l:"h",s:"nowait",q:"Under this sign, you want to unload heavy boxes from your car for 10 minutes. Is that allowed?",o:["Yes, loading is always allowed","No. You may stop only for passengers to board or alight","Yes, if your hazard lights are on"],a:1,w:"No waiting allows stopping only for boarding or alighting. A separate sign covers loading/unloading (p 11)."},
{l:"h",q:"A sign reads 'No waiting and no loading/unloading during stated hours'. Outside those hours:",o:["The restriction does not apply","The restriction still applies at all times","Only loading is allowed"],a:0,w:"The restriction applies during the stated hours only (p 11)."},
{l:"h",q:"A lorry with 2 axles reaches a 'No entry for vehicles with 3 or more axles' sign. It:",o:["Must not enter","May enter only with a police escort","May enter"],a:2,w:"The ban covers vehicles with 3 or more axles only (p 13)."},
{l:"h",q:"A speed limit sign shows 70 km/h, but your vehicle's speed-limit plate says 60 km/h. Your maximum speed is:",o:["60 km/h","70 km/h","65 km/h"],a:0,w:"Never exceed your vehicle's limit or the road's, whichever is lower (pp 34, 52)."},
{l:"h",q:"Which of these is a MANDATORY sign (not a prohibitory one)?",o:["No overtaking","Keep left","No entry for lorries"],a:1,w:"Keep left is mandatory (blue circle). The others are prohibitory (pp 9–13)."},
{l:"h",q:"Which of these is NOT a prohibitory sign?",o:["No left turn","No entry for motorcycles","Turn left ahead"],a:2,w:"Turn left ahead is a mandatory sign (p 9)."},
{l:"h",q:"A 'No entry for motorcycles and pedal cycles' sign applies to cars?",o:["No, only motorcycles and bicycles are banned","Yes, all vehicles are banned","Only during peak hours"],a:0,w:"It bans motorcycles and pedal cycles only (p 13)."},
{l:"h",q:"What is the key difference between a Stop sign and a Give Way sign?",o:["There is no difference","Stop requires a full stop every time; Give Way requires a stop only if necessary","Give Way requires a full stop; Stop does not"],a:1,w:"Compare p 10: Stop = stop before the line; Give Way = slow down, stop if necessary."},
{l:"h",s:"height",q:"Your vehicle is 4.6 m tall and you are travelling with a police escort. Under the handbook rule:",o:["It is still an offence in all cases","You must reduce height to under 4.5 m first","It is permitted with a police escort"],a:2,w:"Driving a vehicle over 4.5 m tall without a police escort is the offence (pp 12, 58)."}
]});
</script>

<!-- ===== DAY 2 ===== -->
<script>
(window.BTT_DAYS=window.BTT_DAYS||[]).push({day:2,
tips:[
"<b>Triangle = warning.</b> Every warning sign starts with the same instruction: <b>slow down and take extra care</b>. If an answer tells you to speed up or ignore it, it's wrong.",
"<b>The 'no-no-no' trio:</b> at bends, steep slopes and roads that narrow, the handbook says <b>do not overtake, make a U-turn or park</b>. Expect a question that offers one of these as an option.",
"<b>Junction signs tell you where traffic comes from:</b> T junction = from the right AND left; side road = from the side shown; merging = from the left; Y junction = from the side(s) shown.",
"<b>Two numbers today:</b> breakdown triangle at least <b>20 m</b> behind the vehicle; Friendly Streets maximum <b>40 km/h</b>.",
"<b>Regulatory signs (pp 19–20)</b> are about how you move: keep left and leave the far-right lane for overtaking; give way where lanes converge; 'One-way traffic' lets you turn right or left; 'One-way street' marks where the one-way section begins.",
"<b>Today:</b> read pp 14–20 and look at every triangle, then do the quiz. Re-do any Day 1 question you got wrong before you start."
],
qs:[
{l:"e",q:"What do warning signs generally tell you to do?",o:["Speed up to clear the hazard quickly","Take extra care and slow down","Sound your horn"],a:1,w:"Warning signs: take extra care, slow down as you approach them (p 14)."},
{l:"e",s:"bendright",q:"What should you do at this sign?",o:["Slow down, keep left, and do not overtake, U-turn or park","Move to the right lane to see better","Overtake before the bend"],a:0,w:"Right bend: slow down, keep left, do not overtake, make a U-turn or park (p 14)."},
{l:"e",s:"crossjn",q:"What does this sign warn you of?",o:["A hospital ahead","A cross junction: beware of traffic approaching the junction","A church ahead"],a:1,w:"Cross junction: slow down, beware of traffic approaching the junction (p 14)."},
{l:"e",s:"roundabout",q:"At the roundabout ahead, you give way to traffic:",o:["On your left","Behind you","On your right"],a:2,w:"Roundabout: slow down, stop if necessary, give way to traffic on the right (p 16)."},
{l:"e",s:"lights",q:"This sign means:",o:["Light signals ahead: beware of the lights changing","Lights out of order","Street lighting ends"],a:0,w:"Light signals ahead (p 16)."},
{l:"e",q:"Most warning signs are shaped like:",o:["A blue circle","A red-bordered triangle","A green rectangle"],a:1,w:"Warning signs are red-bordered triangles (pp 14–18)."},
{l:"e",q:"A 'Slippery road' sign means you should:",o:["Brake hard if you skid","Slow down and drive carefully","Keep your speed steady"],a:1,w:"Slippery road: slow down, drive carefully (p 17)."},
{l:"e",q:"A 'Children' warning sign means:",o:["A playground is closed","Slow down and beware of children crossing the road","Children's cycling lane only"],a:1,w:"Children: slow down, beware of children crossing (p 18)."},
{l:"e",s:"hump",q:"What should you do at this sign?",o:["Speed up to get over it","Move into the right lane","Slow down, keep left, do not overtake"],a:2,w:"Road hump ahead: slow down, keep left, do not overtake (p 17)."},
{l:"e",q:"'Pedestrian crossing ahead' means:",o:["Slow down and stop for pedestrians at the designated crossing","Pedestrians must give way to you","Sound your horn to warn pedestrians"],a:0,w:"Pedestrian crossing ahead (p 16)."},
{l:"m",s:"tjn",q:"At this T junction sign, you should give way to traffic from:",o:["The right only","The left only","The right and left"],a:2,w:"T junction: slow down, give way to traffic from the right and left (p 14)."},
{l:"m",s:"sideleft",q:"This side road sign warns you to beware of vehicles:",o:["From the left","From behind","From the right"],a:0,w:"Side road (left): beware of vehicles from the left (p 15)."},
{l:"m",s:"merge",q:"This 'merging traffic' sign warns of traffic joining from:",o:["The right","The left","Both sides"],a:1,w:"Merging traffic: beware of traffic joining from the left (p 15)."},
{l:"m",q:"A 'staggered junction' sign warns you of vehicles from:",o:["The right and left","Behind only","Oncoming lanes only"],a:0,w:"Staggered junction: beware of vehicles from the right and left (p 15)."},
{l:"m",s:"twoway",q:"This sign means:",o:["Overtaking lane ahead","One-way street","Two-way traffic ahead: keep left, beware of oncoming traffic"],a:2,w:"Two-way traffic ahead (p 15)."},
{l:"m",s:"breakdown",q:"Where should this vehicle breakdown sign be placed?",o:["On the roof of the car","At least 20 m from the rear of the vehicle","5 m in front of the vehicle"],a:1,w:"Vehicle breakdown sign: at least 20 m from the rear (p 17)."},
{l:"m",s:"slope",q:"At a steep downward slope sign, you should:",o:["Keep left, change to a lower gear, and not overtake, U-turn or park","Change to neutral to save fuel","Overtake slow vehicles before the slope"],a:0,w:"Steep slope: keep left, lower gear, do not overtake, U-turn or park (p 17)."},
{l:"m",q:"An 'ungated level crossing' sign warns you to:",o:["Beware of the gate closing","Slow down and beware of trains approaching","Stop for a toll gate"],a:1,w:"Ungated level crossing: beware of trains approaching (p 17)."},
{l:"m",q:"The 'Electronic Road Pricing zone ahead' sign tells you:",o:["Parking charges apply","Speed cameras are ahead","A road charge applies when entering the zone during restricted hours"],a:2,w:"ERP zone ahead (p 16)."},
{l:"m",q:"The 'Expressway ahead' warning sign tells you that:",o:["Certain types of vehicles are prohibited from the expressway","All vehicles must speed up","Expressway tolls start"],a:0,w:"Expressway ahead: certain vehicles are prohibited (p 16)."},
{l:"h",q:"A 'dual-carriageway ends' sign means you should:",o:["Expect the start of an expressway","Slow down, keep left, and beware of oncoming traffic","Move to the right lane"],a:1,w:"Dual-carriageway ends: oncoming traffic will now share the road (p 16)."},
{l:"h",s:"narrows",q:"At this 'road narrows' sign, which of these IS allowed?",o:["Overtaking the vehicle ahead","Making a U-turn","Slowing down and continuing carefully"],a:2,w:"Road narrows: slow down; do not overtake, U-turn or park (p 16)."},
{l:"h",q:"At a 'series of bends' sign, which two actions are BOTH prohibited?",o:["Keeping left and slowing down","Overtaking and parking","Signalling and using mirrors"],a:1,w:"Series of bends: slow down, keep left; do not overtake, U-turn or park (p 14)."},
{l:"h",q:"'Start of Friendly Streets' means vehicles:",o:["Must not exceed 40 km/h and must look out for active mobility users","May use the footpath","Must not exceed 30 km/h at all times"],a:0,w:"Friendly Streets: not more than 40 km/h (p 18)."},
{l:"h",q:"'Start of Silver Zone' tells you to slow down and:",o:["Look out for elderly pedestrians and keep to the posted speed limit","Look out for school buses","Switch on your headlights"],a:0,w:"Silver Zone: look out for elderly pedestrians; follow the posted limit (p 18)."},
{l:"h",q:"A regulatory sign says 'Keep to the left side of the road'. What else does it tell you?",o:["Park on the left only","Leave the outermost right lane for overtaking vehicles","Do not use the left lane"],a:1,w:"p 19: keep left and leave the outermost right lane for overtaking vehicles."},
{l:"h",q:"A blue 'One-way traffic' sign at a junction means vehicles:",o:["May turn right or left","May turn left only","Must go straight ahead"],a:0,w:"One-way traffic: vehicles may turn right or left (p 20)."},
{l:"h",q:"The 'One-way street' sign means:",o:["The road ahead is closed","The one-way street begins from this sign","One-way traffic ends here"],a:1,w:"One-way street: begins from this sign (p 20)."},
{l:"h",s:"chevron",q:"What do these curve alignment markers tell you?",o:["Overtake on the left","A U-turn point","Slow down and drive carefully at the bend"],a:2,w:"Curve alignment markers: slow down and drive carefully at bends (p 20)."},
{l:"h",q:"A 'Low flying aircraft ahead' sign warns you to:",o:["Stop until the aircraft passes","Beware of sudden noise from low-flying aircraft","Switch off your radio"],a:1,w:"Low flying aircraft: beware of sudden noise (p 18)."}
]});
</script>

<!-- ===== DAY 3 ===== -->
<script>
(window.BTT_DAYS=window.BTT_DAYS||[]).push({day:3,
tips:[
"<b>Three numbers to lock in:</b> no parking or stopping within <b>9 m</b> of a bus stop; long goods vehicles are over <b>10 m</b> (trailers over 5 m); power-assisted bicycle riders must be at least <b>16</b>.",
"<b>Tunnel lane signals work like traffic lights:</b> green arrow = lane open; flashing amber X = possible obstruction, slow down and get ready to change lane; red X = lane closed.",
"<b>EMAS travel-time colours:</b> green = up to 50% more than normal; yellow = 50–125% more; red = more than 125%. Lanes are numbered from the <b>fast lane</b> (lane 1) to the slow lane, not counting the shoulder.",
"<b>Sign colours:</b> green = directions; white text in a blue panel = an expressway destination; black on white = facilities; brown = tourist places.",
"<b>Whichever is lower:</b> buses, goods vehicles and trailers obey their own vehicle speed limit or the road limit, whichever is lower.",
"<b>Today:</b> read pp 21–34. These pages are mostly pictures, so spend the time looking at each sign and saying its meaning out loud."
],
qs:[
{l:"e",q:"Information signs are mainly meant to:",o:["Give road users useful information","Prohibit certain vehicles","Warn of hazards ahead"],a:0,w:"Information signs give road users information (p 21)."},
{l:"e",q:"How close to a bus stop may you park or stop?",o:["No closer than 6 m","No closer than 9 m","No closer than 3 m"],a:1,w:"No parking or stopping within 9 m of a bus stop, or inside the bus bay, except buses (p 21)."},
{l:"e",s:"tgreen",q:"In a tunnel, this signal above your lane means:",o:["Lane closed","Slow down, obstruction ahead","Lane open"],a:2,w:"Green arrow = lane open (p 25)."},
{l:"e",s:"tred",q:"In a tunnel, this red X above your lane means:",o:["Lane closed","Lane open for buses only","Speed camera ahead"],a:0,w:"Red cross = lane closed (p 25)."},
{l:"e",q:"A red man pedestrian signal means pedestrians:",o:["May cross quickly","Must not cross","May cross if no cars are coming"],a:1,w:"Red man = do not cross (p 24)."},
{l:"e",q:"Directional signs are usually rectangular with a:",o:["Blue background","Brown background","Green background"],a:2,w:"Directional signs: rectangular, green background (p 27)."},
